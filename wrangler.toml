# name deve bater com o nome exato do projeto no Cloudflare Pages
# (visível na URL: dash.cloudflare.com/.../pages/view/<name>).
#
# pages_build_output_dir é o que faz o Cloudflare (com Wrangler v4+) tratar
# isto como um projeto Pages de verdade: deploy automático via "wrangler
# deploy" servindo os arquivos de dist/ + as Pages Functions em functions/.
# Requer Wrangler v4 (ver package.json) — em v3 essa chave quebra o deploy.
name = "tekidu"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
