# Usado só para desenvolvimento local (`npm run dev:functions`, que roda
# `wrangler pages dev`). NÃO tem pages_build_output_dir de propósito: essa
# chave faz o Cloudflare Pages trocar o comando de deploy do build remoto
# para `wrangler deploy` (Workers), que quebra com Wrangler 3.x — o output
# directory de produção continua sendo configurado só no dashboard do
# Cloudflare Pages (Settings → Builds → Build output directory: dist).
name = "tekidu"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
